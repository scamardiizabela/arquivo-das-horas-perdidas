<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>O Arquivo das Horas Perdidas | Prólogo</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e18;color:#f2e5c9;font-family:Georgia,serif;overflow:hidden}#game{display:block;width:100vw;height:100dvh;touch-action:manipulation}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:12px;left:15px;font:600 12px system-ui;letter-spacing:.15em;color:#dcc7a0;text-shadow:0 2px 4px #000}#bottom{position:absolute;bottom:0;left:0;right:0;padding:12px max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b1019 20%);pointer-events:auto}#speaker{font:600 11px system-ui;letter-spacing:.12em;color:#caa773;margin-bottom:5px}#dialog{font-size:clamp(14px,2.6vw,21px);min-height:44px;line-height:1.3;max-width:880px}#buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}button{border:1px solid #a88b5d;background:#26303d;color:#f7e8cb;border-radius:7px;padding:10px 14px;font:600 13px system-ui;cursor:pointer;min-height:42px}button:active{background:#6b553a}#hint{position:absolute;right:14px;top:12px;color:#b5ac9d;font:11px system-ui;text-align:right;max-width:50%}@media(orientation:portrait){#hint{top:36px}} </style></head><body><canvas id="game"></canvas><div id="ui"><div id="top">O ARQUIVO DAS HORAS PERDIDAS <span style="opacity:.5"> · PRÓLOGO 0.2</span></div><div id="hint">Protótipo visual interativo · toque nos botões</div><div id="bottom"><div id="speaker"></div><div id="dialog"></div><div id="buttons"></div></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),speaker=document.getElementById('speaker'),dialog=document.getElementById('dialog'),buttons=document.getElementById('buttons');
let stage=0,step=0,opened=false,hasCase=false,dials=[0,0,0],tick=0,flash=0;const symbols=['MALA','ENVELOPE','CHAVE','ESTRELA'];
function resize(){canvas.width=Math.max(600,Math.floor(innerWidth*devicePixelRatio));canvas.height=Math.max(340,Math.floor(innerHeight*devicePixelRatio));}addEventListener('resize',resize);resize();
function line(x,y,X,Y,c='#bda47b',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)ctx.lineTo(...pts[i]);ctx.closePath();ctx.fill()}
function oval(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function txt(t,x,y,s=20,c='#e7d3aa',align='left'){ctx.fillStyle=c;ctx.font=`${s}px Georgia`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function windowScene(x,y,w,h){rect(x,y,w,h,'#0c1c2d');for(let i=0;i<20;i++){let px=x+(i*41+tick*.15)%w;line(px,y,px-32,y+h,'#314b60',1)}rect(x,y,w,9,'#95764d');rect(x,y,8,h,'#95764d');rect(x+w-8,y,8,h,'#95764d');rect(x+w/2-3,y,6,h,'#806746')}
function elara(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);poly([[-37,0],[39,0],[57,130],[-61,130]],'#273647');poly([[-28,0],[26,0],[18,60],[-21,60]],'#52606a');rect(-15,-20,30,36,'#b89b82');oval(0,-57,34,45,'#3a292a');oval(0,-51,26,35,'#d0a78c');poly([[-36,-68],[-23,-107],[22,-106],[38,-67],[12,-80],[-25,-70]],'#2b2227');line(-45,31,-68,105,'#bd9a83',11);line(43,29,60,104,'#bd9a83',11);ctx.restore()}
function conductor(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);poly([[-42,0],[42,0],[51,145],[-51,145]],'#202c36');rect(-28,10,56,14,'#91734f');rect(-14,-25,28,35,'#d4b299');oval(0,-57,27,35,'#c8a487');poly([[-39,-79],[40,-79],[31,-100],[-29,-100]],'#1d2934');rect(-25,-102,50,13,'#263442');line(-33,28,-42,111,'#b6a17b',10);ctx.restore()}
function envelope(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(-.1);rect(-105,-57,210,114,'#d7bd8e');line(-105,-57,0,13,'#94754f');line(105,-57,0,13,'#94754f');oval(0,12,14,14,'#783d3a');ctx.restore()}
function background(){let g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#121c2c');g.addColorStop(.7,'#253142');g.addColorStop(1,'#0a1019');rect(0,0,1280,720,g);if(stage===0){rect(0,95,1280,470,'#3d3539');for(let x=0;x<1280;x+=150)rect(x,95,8,480,'#665347');windowScene(755,125,360,285);rect(0,570,1280,150,'#2b2228');rect(180,440,390,110,'#6c5040');rect(175,430,400,18,'#b39269');rect(120,350,180,210,'#533a40');rect(95,338,235,26,'#74525a');elara(510,325,1.25);envelope(405,464,.45);oval(980,130,65,16,'#b59460');rect(975,128,10,75,'#a78957');}
else{rect(0,85,1280,505,'#39343b');for(let x=40;x<1280;x+=180)rect(x,85,13,510,'#80624b');rect(0,580,1280,140,'#372a30');windowScene(725,142,350,300);rect(45,400,430,160,'#6b3f4d');rect(65,380,380,55,'#8b5760');rect(450,440,230,28,'#b58d5c');rect(470,468,25,95,'#6b523f');rect(635,110,95,70,'#67523d');rect(638,110,95,8,'#c09b67');rect(1080,160,135,400,'#5c463e');rect(1080,160,135,14,'#a98a60');oval(1184,371,7,7,'#c9a26c');elara(560,348,1.08);if(stage===1)conductor(930,365,1.02);}
for(let i=0;i<5;i++)oval(90+i*270,98+Math.sin(tick*.025+i)*3,8,6,'#dfb96e');
}
function overlay(){if(stage===2){rect(250,105,780,430,'#111b27');rect(258,113,764,414,'#453a35');rect(280,140,720,345,'#292a31');txt('GUARDA-VOLUMES · COMPARTIMENTO DE ELARA',640,185,24,'#e8c58e','center');for(let i=0;i<3;i++){rect(360+i*190,235,145,112,'#69533e');rect(371+i*190,245,123,91,'#1b2732');txt(symbols[dials[i]],432+i*190,297,18,'#f1d6a3','center')}txt('Toque em cada disco para girar os símbolos.',640,400,21,'#d5c2a5','center');if(opened)txt('O compartimento está aberto.',640,450,22,'#9ed0b6','center')}
if(stage===3){rect(260,140,760,350,'#151d29');rect(270,150,740,330,'#57483c');rect(310,190,660,240,'#c5aa7d');txt('DOCUMENTOS PESSOAIS',640,235,25,'#473a2c','center');txt('Fotografia antiga de Vespera',340,290,20,'#473a2c');txt('Carta incompleta: "Se algum dia você voltar..."',340,334,19,'#473a2c');txt('Medalhão de latão, círculos entrecruzados',340,380,19,'#473a2c')}
}
function render(){tick++;ctx.setTransform(canvas.width/1280,0,0,canvas.height/720,0,0);background();overlay();requestAnimationFrame(render)}render();
function show(who,t,actions){speaker.textContent=who;dialog.textContent=t;buttons.replaceChildren();actions.forEach(([name,fn])=>{const b=document.createElement('button');b.textContent=name;b.onclick=fn;buttons.appendChild(b)})}
function next(){if(stage===0){step++;if(step===1)show('ELARA','Uma carta sem remetente. Por que alguém me pediria para voltar a um lugar onde nunca estive?',[['Abrir a carta',next]]);else if(step===2)show('CARTA','“Se algum dia você voltar, procure aquilo que permanece quando todas as outras coisas desaparecem.”',[['Seguir para o trem',()=>{stage=1;step=0;next()}]]);}
else if(stage===1){step++;if(step===1)show('CONDUTOR','Seu bilhete, por gentileza. Vespera... Não recebemos muitos passageiros a esta hora.',[['Entregar bilhete',next]]);else if(step===2)show('ELARA','O senhor conhece bem a cidade?',[['Ouvir resposta',next]]);else if(step===3)show('CONDUTOR','Conheço o caminho até lá. Curioso... tive a impressão de já ter visto este nome.',[['Perguntar sobre o nome',()=>{show('CONDUTOR','Desculpe. Deve ser apenas cansaço. A viagem será longa. Guarde bem seus pertences.',[['Continuar',next]])}],['Ficar em silêncio',next]]);else{stage=2;show('ELARA','Minha mala está no guarda-volumes. O formulário na mesa fala de bagagem de mão, documentos e retirada autorizada.',[['Examinar formulário',()=>show('FORMULÁRIO','Bagagem de mão = MALA. Documentos pessoais = ENVELOPE. Retirada autorizada = CHAVE.',[['Voltar ao guarda-volumes',()=>{stage=2;next()}]])],['Girar discos',()=>showPuzzle()],['Testar combinação',testPuzzle]])}}
else if(stage===2)showPuzzle()}
function showPuzzle(){show('ELARA','Preciso selecionar os símbolos na ordem correta. Toque nos discos ou use os botões.',[['Disco 1',()=>{dials[0]=(dials[0]+1)%4;showPuzzle()}],['Disco 2',()=>{dials[1]=(dials[1]+1)%4;showPuzzle()}],['Disco 3',()=>{dials[2]=(dials[2]+1)%4;showPuzzle()}],['Testar',testPuzzle],['Ver formulário',()=>show('FORMULÁRIO','Bagagem de mão = MALA. Documentos pessoais = ENVELOPE. Retirada autorizada = CHAVE.',[['Voltar',showPuzzle]])]])}
function testPuzzle(){
 if(dials.join() !== '0,1,2'){
  show('ELARA','Não abriu. A ordem precisa seguir as três categorias do formulário.',[
   ['Tentar novamente',showPuzzle],
   ['Consultar formulário',()=>show('FORMULÁRIO','MALA → ENVELOPE → CHAVE.',[['Voltar',showPuzzle]])]
  ]);return;
 }
 opened=true;
 show('ELARA','Ouvi os pinos se soltarem. O compartimento abriu.',[
  ['Pegar meu estojo',()=>{
   stage=3;hasCase=true;
   show('ELARA','Uma fotografia antiga, a carta e um medalhão. A estação da foto parece familiar, mas por quê?',[
    ['Examinar documentos',()=>show('DIÁRIO','Fotografia: “Onde tudo começou”. Carta sem assinatura. Medalhão de círculos entrecruzados.',[['Concluir teste',finish]])],
    ['Concluir teste',finish]
   ]);
  }]
 ]);
}
function finish(){show('PROTÓTIPO 0.2','Você concluiu a primeira interação com a mala. Próximo trecho será construído após sua avaliação.',[['Recomeçar',reset]])}
function reset(){stage=0;step=0;opened=false;hasCase=false;dials=[0,0,0];show('NARRAÇÃO','Uma carta chega sem remetente, numa noite de chuva. A mensagem parece conhecer um passado que Elara não consegue recordar.',[['Examinar a carta',next]])}
canvas.addEventListener('pointerdown',e=>{if(stage!==2)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1280/r.width,y=(e.clientY-r.top)*720/r.height;if(y>235&&y<350&&x>360&&x<885){let i=Math.floor((x-360)/190);if(i>=0&&i<3){dials[i]=(dials[i]+1)%4;showPuzzle()}}});reset();
</script></body></html>
