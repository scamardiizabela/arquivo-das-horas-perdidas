<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>O Arquivo das Horas Perdidas | Prólogo</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e18;color:#f2e5c9;font-family:Georgia,serif;overflow:hidden}#game{display:block;width:100vw;height:100dvh;touch-action:manipulation}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:12px;left:15px;font:600 12px system-ui;letter-spacing:.15em;color:#dcc7a0;text-shadow:0 2px 4px #000}#bottom{position:absolute;bottom:0;left:0;right:0;padding:12px max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b1019 20%);pointer-events:auto}#speaker{font:600 11px system-ui;letter-spacing:.12em;color:#caa773;margin-bottom:5px}#dialog{font-size:clamp(14px,2.6vw,21px);min-height:20px;line-height:1.3;max-width:880px}#buttons{display:none}button{border:1px solid #a88b5d;background:#26303d;color:#f7e8cb;border-radius:7px;padding:10px 14px;font:600 13px system-ui;cursor:pointer;min-height:42px}button:active{background:#6b553a}#hint{position:absolute;right:14px;top:12px;color:#b5ac9d;font:11px system-ui;text-align:right;max-width:50%}@media(orientation:portrait){#hint{top:36px}} </style></head><body><canvas id="game"></canvas><div id="ui"><div id="top">O ARQUIVO DAS HORAS PERDIDAS <span style="opacity:.5"> · PRÓLOGO 0.3</span></div><div id="hint">Toque nos objetos do cenário</div><div id="bottom"><div id="speaker"></div><div id="dialog"></div><div id="buttons"></div></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),speaker=document.getElementById('speaker'),dialog=document.getElementById('dialog'),buttons=document.getElementById('buttons');
let stage=0,step=0,opened=false,hasCase=false,dials=[0,0,0],tick=0,flash=0,focus="",letterRead=false,dialogTimer=null;const symbols=['MALA','ENVELOPE','CHAVE','ESTRELA'];
function resize(){canvas.width=Math.max(600,Math.floor(innerWidth*devicePixelRatio));canvas.height=Math.max(340,Math.floor(innerHeight*devicePixelRatio));}addEventListener('resize',resize);resize();
function line(x,y,X,Y,c='#bda47b',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)ctx.lineTo(...pts[i]);ctx.closePath();ctx.fill()}
function oval(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function txt(t,x,y,s=20,c='#e7d3aa',align='left'){ctx.fillStyle=c;ctx.font=`${s}px Georgia`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function windowScene(x,y,w,h){rect(x,y,w,h,'#0c1c2d');for(let i=0;i<20;i++){let px=x+(i*41+tick*.15)%w;line(px,y,px-32,y+h,'#314b60',1)}rect(x,y,w,9,'#95764d');rect(x,y,8,h,'#95764d');rect(x+w-8,y,8,h,'#95764d');rect(x+w/2-3,y,6,h,'#806746')}
function elara(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);poly([[-37,0],[39,0],[57,130],[-61,130]],'#273647');poly([[-28,0],[26,0],[18,60],[-21,60]],'#52606a');rect(-15,-20,30,36,'#b89b82');oval(0,-57,34,45,'#3a292a');oval(0,-51,26,35,'#d0a78c');poly([[-36,-68],[-23,-107],[22,-106],[38,-67],[12,-80],[-25,-70]],'#2b2227');line(-45,31,-68,105,'#bd9a83',11);line(43,29,60,104,'#bd9a83',11);ctx.restore()}
function conductor(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);poly([[-42,0],[42,0],[51,145],[-51,145]],'#202c36');rect(-28,10,56,14,'#91734f');rect(-14,-25,28,35,'#d4b299');oval(0,-57,27,35,'#c8a487');poly([[-39,-79],[40,-79],[31,-100],[-29,-100]],'#1d2934');rect(-25,-102,50,13,'#263442');line(-33,28,-42,111,'#b6a17b',10);ctx.restore()}
function envelope(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(-.1);rect(-105,-57,210,114,'#d7bd8e');line(-105,-57,0,13,'#94754f');line(105,-57,0,13,'#94754f');oval(0,12,14,14,'#783d3a');ctx.restore()}
function background(){let g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#121c2c');g.addColorStop(.7,'#253142');g.addColorStop(1,'#0a1019');rect(0,0,1280,720,g);if(stage===0){rect(0,95,1280,470,'#3d3539');for(let x=0;x<1280;x+=150)rect(x,95,8,480,'#665347');windowScene(755,125,360,285);rect(0,570,1280,150,'#2b2228');rect(180,440,390,110,'#6c5040');rect(175,430,400,18,'#b39269');rect(120,350,180,210,'#533a40');rect(95,338,235,26,'#74525a');elara(510,325,1.25);envelope(405,464,.65);oval(980,130,65,16,'#b59460');rect(975,128,10,75,'#a78957');}
else{rect(0,85,1280,505,'#39343b');for(let x=40;x<1280;x+=180)rect(x,85,13,510,'#80624b');rect(0,580,1280,140,'#372a30');windowScene(725,142,350,300);rect(45,400,430,160,'#6b3f4d');rect(65,380,380,55,'#8b5760');rect(450,440,230,28,'#b58d5c');rect(470,468,25,95,'#6b523f');rect(635,110,95,70,'#67523d');rect(638,110,95,8,'#c09b67');rect(1080,160,135,400,'#5c463e');rect(1080,160,135,14,'#a98a60');oval(1184,371,7,7,'#c9a26c');elara(560,348,1.08);if(stage===1)conductor(930,365,1.02);if(stage===2){rect(648,110,190,68,"#796148");rect(660,117,166,50,"#3a3130");txt("GUARDA-VOLUMES",744,147,15,"#dfc89c","center");rect(475,443,115,18,"#d7bf94");}}
for(let i=0;i<5;i++)oval(90+i*270,98+Math.sin(tick*.025+i)*3,8,6,'#dfb96e');
}

function overlay(){
 if(!focus && stage===0){txt("✦",410,447,34,"#f3dba0","center");}
 if(!focus && stage===2){txt("✦",744,104,28,"#f3dba0","center");txt("✦",533,432,25,"#f3dba0","center");}
 if(focus){
 rect(175,83,930,475,"#111721");rect(185,93,910,455,"#463c36");rect(205,113,870,414,"#222a34");
 txt("✕",1042,147,34,"#d9c6a2","center");
 }
 if(focus==="letter"){envelope(640,295,1.55);txt("Uma carta sem remetente.",640,435,25,"#f2ddae","center");txt("Toque na carta para abrir",640,482,18,"#c4a77b","center")}
 if(focus==="letter_open"){rect(350,155,580,310,"#d7be91");txt("Se algum dia você voltar,",640,238,25,"#46392c","center");txt("procure aquilo que permanece",640,286,25,"#46392c","center");txt("quando tudo desaparecer.",640,334,25,"#46392c","center");txt("Toque na carta para guardá-la",640,417,18,"#46392c","center")}
 if(focus==="form"){rect(330,148,620,310,"#d2b78a");txt("REGULAMENTO DE BAGAGEM",640,204,24,"#46392c","center");txt("Bagagem de mão → MALA",640,271,23,"#46392c","center");txt("Documentos pessoais → ENVELOPE",640,318,23,"#46392c","center");txt("Retirada autorizada → CHAVE",640,365,23,"#46392c","center")}
 if(focus==="bag"){
  txt("GUARDA-VOLUMES",640,167,26,"#e6c897","center");
  for(let i=0;i<3;i++){rect(290+i*236,240,190,125,"#806447");rect(302+i*236,251,166,103,"#25303a");txt(symbols[dials[i]],385+i*236,315,20,"#ead7a9","center");}
  txt(opened?"A trava se soltou. Toque na tampa para abrir.":"Toque nos discos. Depois, toque na fechadura.",640,425,21,"#d8c5a3","center");
  oval(640,480,35,20,opened?"#8cbda4":"#b69a70");
 }
 if(focus==="case"){rect(280,158,720,310,"#654a3c");rect(302,177,676,272,"#c2a47d");txt("ESTOJO DE ELARA",640,218,25,"#42352c","center");txt("FOTOGRAFIA",425,288,19,"#42352c","center");txt("CARTA",650,288,19,"#42352c","center");txt("MEDALHÃO",840,288,19,"#42352c","center");txt("Toque em um objeto para examiná-lo",640,411,19,"#42352c","center")}
 if(focus==="photo"||focus==="medallion"||focus==="case_letter"){txt(focus==="photo"?"Fotografia de Vespera":"",640,232,28,"#e4c89a","center");txt(focus==="medallion"?"Medalhão de círculos entrecruzados":"",640,232,26,"#e4c89a","center");txt(focus==="case_letter"?"Se algum dia você voltar...":"",640,232,26,"#e4c89a","center");txt("Toque no ✕ para voltar",640,425,20,"#cfb690","center")}
}
function render(){tick++;ctx.setTransform(canvas.width/1280,0,0,canvas.height/720,0,0);background();overlay();requestAnimationFrame(render)}render();
function caption(who,text){speaker.textContent=who;dialog.textContent=text;}
function startTrain(){focus="";stage=1;caption("","");const lines=[["CONDUTOR","Seu bilhete, por gentileza. Vespera... Não recebemos muitos passageiros a esta hora."],["ELARA","O senhor conhece bem a cidade?"],["CONDUTOR","Conheço o caminho até lá. Curioso... tive a impressão de já ter visto este nome."],["CONDUTOR","Desculpe. Deve ser apenas cansaço. A viagem será longa. Guarde bem seus pertences."]];let i=0;function advance(){if(stage!==1)return;if(i>=lines.length){stage=2;caption("ELARA","Meu estojo deve estar no guarda-volumes.");return;}caption(...lines[i++]);dialogTimer=setTimeout(advance,3600)}setTimeout(advance,700)}
function pointer(x,y){
 if(focus){
  if(x>1000&&y<190){if(focus==="photo"||focus==="medallion"||focus==="case_letter")focus="case";else focus="";return;}
  if(focus==="letter"){focus="letter_open";caption("ELARA","Quem teria escrito isso?");return}
  if(focus==="letter_open"){letterRead=true;startTrain();return}
  if(focus==="form"){focus="";return}
  if(focus==="bag"){
   if(opened){focus="case";hasCase=true;caption("ELARA","Encontrei meu estojo.");return}
   if(y>=225&&y<=380){for(let i=0;i<3;i++){if(x>=290+i*236&&x<=480+i*236){dials[i]=(dials[i]+1)%4;return}}}
   if(y>450){if(dials.join()==="0,1,2"){opened=true;caption("ELARA","A trava se soltou.")}else caption("ELARA","Ainda não. Preciso conferir os símbolos do formulário.");return}
   return;
  }
  if(focus==="case"){if(y>240&&y<390){focus=x<540?"photo":x<760?"case_letter":"medallion";caption("ELARA",focus==="photo"?"No verso: Onde tudo começou.":focus==="medallion"?"Este símbolo...":"A carta está incompleta.");}return}
  return;
 }
 if(stage===0){if(x>280&&x<530&&y>365&&y<560){focus="letter";caption("ELARA","Uma carta sem remetente...");}return}
 if(stage===1)return;
 if(stage===2){if(x>620&&x<865&&y>90&&y<200){focus="bag";caption("ELARA","Três discos. Deve haver uma ordem.");return}
 if(x>430&&x<690&&y>400&&y<515){focus="form";caption("ELARA","As instruções de classificação.");return}
 if(x>0&&x<440&&y>365&&y<575){caption("ELARA","Meu assento. A bagagem foi guardada acima.");return}}
}
canvas.addEventListener("pointerdown",e=>{const r=canvas.getBoundingClientRect();pointer((e.clientX-r.left)*1280/r.width,(e.clientY-r.top)*720/r.height)});
caption("","Toque na carta sobre a mesa para examiná-la.");
</script></body></html>
