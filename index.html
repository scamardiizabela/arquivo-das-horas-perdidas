<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1421"><title>O Arquivo das Horas Perdidas | O Último Trem</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e18;color:#f4e5c7;font-family:Georgia,serif}button{font:inherit;color:inherit;cursor:pointer}#stage{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse,#3b2930,#080d16)}#scene{position:relative;width:min(100vw,177.77778dvh);height:min(100dvh,56.25vw);overflow:hidden;box-shadow:0 0 90px #0009;background:#111b29;border:2px solid #80633c;border-radius:8px}canvas{width:100%;height:100%;display:block}#hotspots{position:absolute;inset:0;pointer-events:none}.hotspot{position:absolute;border:0;background:transparent;pointer-events:auto;border-radius:14px;outline-offset:2px}.hotspot:focus-visible{outline:2px solid #e4c38a}.hotspot:active{background:#edc88620}.hotspot.glow:after{content:"";position:absolute;inset:20%;border-radius:50%;box-shadow:0 0 25px 8px #e7bd7566;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.2}}#title{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;pointer-events:none;font:600 11px system-ui;letter-spacing:.13em;text-shadow:0 2px 5px #000}#controls{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:8px} .control{border:1px solid #b39868aa;background:linear-gradient(145deg,#382c28ee,#111b28ee);border-radius:10px;min-width:44px;min-height:44px;padding:8px 12px;font:600 12px system-ui}#inventory{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));right:12px;display:flex;gap:7px;align-items:end;max-width:95vw;flex-wrap:wrap;justify-content:end}.item{border:1px solid #aa8c60;background:linear-gradient(160deg,#382b28ef,#111a27f2);padding:10px;border-radius:9px;min-height:44px;font:12px system-ui}.item[aria-pressed=true]{background:#80613b}#caption{position:fixed;bottom:clamp(65px,12vh,110px);left:50%;transform:translateX(-50%);width:min(90vw,740px);padding:12px 20px;text-align:center;background:#0a111bdb;border:1px solid #a68a5d66;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .3s;line-height:1.5;font-size:clamp(13px,2.3vw,20px)}#caption.show{opacity:1}#speaker{font:700 11px system-ui;letter-spacing:.12em;color:#d4ac70;margin-bottom:4px}#modal{position:fixed;inset:0;background:#03070cc9;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}#modal.show{display:flex}#panel{position:relative;width:min(760px,96vw);max-height:88dvh;overflow:auto;background:linear-gradient(140deg,#4a342e,#121e2c);border:2px solid #ad8a59;border-radius:16px;box-shadow:0 24px 100px #000;padding:clamp(20px,4vw,42px);text-align:center}#panel h2{font-size:clamp(20px,3vw,30px);font-weight:normal;margin:0 40px 18px}#panel p{line-height:1.7}#close{position:absolute;right:10px;top:10px;background:#263647;border:1px solid #9d8057;border-radius:9px;width:44px;height:44px;font-size:24px}#object{margin:15px auto 20px;display:grid;place-items:center;min-height:120px}#object button,.action{background:#354254;border:1px solid #b99b6c;border-radius:10px;padding:14px 20px;min-height:48px}#object button{font-size:clamp(16px,3vw,24px)}.paper{background:#dcc39a;color:#352b25;padding:24px;max-width:540px;width:100%;box-shadow:3px 8px 25px #0008;transform:rotate(-1deg);font-size:clamp(16px,2.4vw,23px);line-height:1.7}.dials{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.dial{width:min(29%,170px);min-width:105px;height:105px;background:#293440;border:8px ridge #9b784e;border-radius:12px;font:600 15px system-ui}.action{margin-top:15px}.small{font:12px system-ui;color:#bca889}.clue{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.clue button{min-width:110px}@media(max-width:600px){#title{max-width:52%;font-size:9px}#caption{bottom:80px}#panel{padding:18px}#panel h2{margin-top:28px}.dial{min-width:82px;height:80px;font-size:11px}}

/* Direção visual 0.5: molduras de latão, interface de época e pontos de atenção discretos. */
#scene:after{content:"";position:absolute;inset:0;pointer-events:none;border:clamp(2px,.45vw,7px) ridge #9c7844aa;box-shadow:inset 0 0 45px #0609129c}
#title{padding:12px 16px;border:1px solid #ad8a58;border-radius:4px 16px 4px 16px;background:linear-gradient(125deg,#35271fe8,#0c1524ed);box-shadow:0 5px 25px #0008;color:#e6c48c}
.control,.item{box-shadow:inset 0 1px #e4c18455,0 5px 14px #0008;border-color:#c3a06c}
#inventory{padding:8px;border:1px solid #987347;border-radius:16px;background:linear-gradient(140deg,#261c1bea,#0b1421ef);box-shadow:0 5px 28px #0009}
#panel{box-shadow:inset 0 0 0 5px #141b27,0 25px 90px #000;border:3px double #c19b62}
#panel h2{color:#f2d7a4;text-shadow:0 2px 7px #000}
#caption{border:1px solid #c09a5e;background:linear-gradient(100deg,#0a111bea,#30241feb,#0a111bea)}
.hotspot.glow:after{box-shadow:0 0 22px 8px #efc578aa}
@media(max-width:600px){#title{padding:8px;font-size:8px}#inventory{padding:4px}.item{padding:7px}}
</style></head><body><div id="stage"><div id="scene"><canvas id="art" width="1280" height="720" aria-label="Vagão de trem interativo"></canvas><div id="hotspots"></div></div></div><div id="title">O ARQUIVO DAS HORAS PERDIDAS · PRÓLOGO 0.5</div><div id="controls"><button class="control" id="hint" aria-label="Mostrar objetos interativos">✧ Dica</button><button class="control" id="restart" aria-label="Reiniciar jogo">↺</button></div><div id="caption" aria-live="polite"><div id="speaker"></div><div id="words"></div></div><div id="inventory" aria-label="Inventário"></div><div id="modal" role="dialog" aria-modal="true" aria-label="Examinar objeto"><div id="panel"><button id="close" aria-label="Voltar">×</button><h2 id="heading"></h2><div id="object"></div><p id="description"></p></div></div>
<script>
'use strict';
const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d'),hotspots=document.querySelector('#hotspots'),modal=document.querySelector('#modal'),heading=document.querySelector('#heading'),object=document.querySelector('#object'),description=document.querySelector('#description'),inventory=document.querySelector('#inventory'),captionBox=document.querySelector('#caption');
const key='arquivo-horas-prologo-v04';
const fresh=()=>({stage:0,letterRead:false,opened:false,hasCase:false,dials:[0,0,0],items:[],seen:[]});
let state;try{state=Object.assign(fresh(),JSON.parse(localStorage.getItem(key)||'null')||{});}catch{state=fresh()}let focus='',tick=0,dialogTimer,captionTimer,dialogIndex=0,showHints=false;
const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}};
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function line(x,y,X,Y,c='#bda47b',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}
function poly(p,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(...p[0]);p.slice(1).forEach(q=>ctx.lineTo(...q));ctx.closePath();ctx.fill()}
function oval(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function txt(t,x,y,s=20,c='#e7d3aa',align='left'){ctx.fillStyle=c;ctx.font=s+'px Georgia';ctx.textAlign=align;ctx.fillText(t,x,y)}
function windowScene(x,y,w,h){rect(x,y,w,h,'#0c1c2d');ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();for(let i=0;i<32;i++){const px=x+(i*49+tick*.7)%(w+80);line(px,y,px-42,y+h,'#53718a',1)}ctx.restore();rect(x,y,w,9,'#95764d');rect(x,y,8,h,'#95764d');rect(x+w-8,y,8,h,'#95764d');rect(x+w/2-3,y,6,h,'#806746')}
function elara(x,y,s=1){ctx.save();ctx.translate(x,y+Math.sin(tick*.015)*1.8);ctx.scale(s,s);poly([[-37,0],[39,0],[57,130],[-61,130]],'#273647');poly([[-28,0],[26,0],[18,60],[-21,60]],'#52606a');rect(-15,-20,30,36,'#b89b82');oval(0,-57,34,45,'#3a292a');oval(0,-51,26,35,'#d0a78c');poly([[-36,-68],[-23,-107],[22,-106],[38,-67],[12,-80],[-25,-70]],'#2b2227');line(-45,31,-68,105,'#bd9a83',11);line(43,29,60,104,'#bd9a83',11);ctx.restore()}
function conductor(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);poly([[-42,0],[42,0],[51,145],[-51,145]],'#202c36');rect(-28,10,56,14,'#91734f');rect(-14,-25,28,35,'#d4b299');oval(0,-57,27,35,'#c8a487');poly([[-39,-79],[40,-79],[31,-100],[-29,-100]],'#1d2934');rect(-25,-102,50,13,'#263442');line(-33,28,-42,111,'#b6a17b',10);ctx.restore()}
function envelope(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(-.1);rect(-105,-57,210,114,'#d7bd8e');line(-105,-57,0,13,'#94754f');line(105,-57,0,13,'#94754f');oval(0,12,14,14,'#783d3a');ctx.restore()}
function draw(){tick++;const g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#121c2c');g.addColorStop(.7,'#253142');g.addColorStop(1,'#0a1019');rect(0,0,1280,720,g);
if(state.stage===0){rect(0,95,1280,470,'#3d3539');for(let x=0;x<1280;x+=150)rect(x,95,8,480,'#665347');windowScene(755,125,360,285);rect(0,570,1280,150,'#2b2228');rect(180,440,390,110,'#6c5040');rect(175,430,400,18,'#b39269');rect(120,350,180,210,'#533a40');rect(95,338,235,26,'#74525a');elara(510,325,1.25);if(!state.letterRead)envelope(405,464,.65);oval(980,130,65,16,'#b59460');rect(975,128,10,75,'#a78957')}
else{rect(0,85,1280,505,'#39343b');for(let x=40;x<1280;x+=180)rect(x,85,13,510,'#80624b');rect(0,580,1280,140,'#372a30');windowScene(725,142,350,300);rect(45,400,430,160,'#6b3f4d');rect(65,380,380,55,'#8b5760');rect(450,440,230,28,'#b58d5c');rect(470,468,25,95,'#6b523f');rect(635,110,95,70,'#67523d');rect(638,110,95,8,'#c09b67');rect(1080,160,135,400,'#5c463e');rect(1080,160,135,14,'#a98a60');oval(1184,371,7,7,'#c9a26c');elara(560,348,1.08);if(state.stage===1)conductor(930,365,1.02);if(state.stage===2){rect(648,110,190,68,'#796148');rect(660,117,166,50,'#3a3130');txt('GUARDA-VOLUMES',744,147,15,'#dfc89c','center');rect(475,443,115,18,'#d7bf94')}}
for(let i=0;i<5;i++)oval(90+i*270,98+Math.sin(tick*.025+i)*3,8,6,'#dfb96e');const vignette=ctx.createRadialGradient(640,340,160,640,360,770);vignette.addColorStop(0,'#00000000');vignette.addColorStop(1,'#05060ad9');rect(0,0,1280,720,vignette);requestAnimationFrame(draw)}draw();
function caption(who,text,ms=3800){clearTimeout(captionTimer);document.querySelector('#speaker').textContent=who;document.querySelector('#words').textContent=text;captionBox.classList.add('show');captionTimer=setTimeout(()=>captionBox.classList.remove('show'),ms)}
function addItem(item){if(!state.items.includes(item)){state.items.push(item);save();renderInventory()}}
function renderInventory(){inventory.replaceChildren();state.items.forEach(item=>{const b=document.createElement('button');b.className='item';b.textContent=({carta:'✉ Carta',estojo:'▣ Estojo'})[item]||item;b.onclick=()=>openFocus(item==='carta'?'letter_open':'case');inventory.append(b)})}
function hotspot(x,y,w,h,label,fn){const b=document.createElement('button');b.className='hotspot'+(showHints?' glow':'');b.style.left=x/12.8+'%';b.style.top=y/7.2+'%';b.style.width=w/12.8+'%';b.style.height=h/7.2+'%';b.setAttribute('aria-label',label);b.title=label;b.onclick=fn;hotspots.append(b)}
function renderHotspots(){hotspots.replaceChildren();if(state.stage===0){if(!state.letterRead)hotspot(305,418,205,100,'Examinar envelope',()=>openFocus('letter'));else hotspot(720,140,410,280,'Observar a janela',()=>caption('ELARA','A paisagem parece não mudar.'))}
if(state.stage===2){hotspot(630,90,225,135,'Examinar guarda-volumes',()=>openFocus(state.opened?'case':'bag'));hotspot(445,400,240,120,'Examinar formulário de bagagem',()=>openFocus('form'));hotspot(50,365,400,200,'Examinar assento',()=>caption('ELARA','Meu assento. A bagagem foi guardada acima.'))}}
function openFocus(next){focus=next;heading.textContent=({letter:'Envelope sem remetente',letter_open:'A carta',form:'Regulamento de bagagem',bag:'Guarda-volumes',case:'Estojo de Elara',photo:'Fotografia de Vespera',case_letter:'Carta incompleta',medallion:'Medalhão'})[next]||next;object.replaceChildren();description.textContent='';modal.classList.add('show');const action=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b};const paper=(content)=>{const d=document.createElement('div');d.className='paper';d.textContent=content;return d};
if(next==='letter'){object.append(action('✉ Abrir envelope',()=>{caption('ELARA','Quem teria escrito isso?');openFocus('letter_open')}));description.textContent='O lacre parece antigo. Não há remetente.'}
if(next==='letter_open'){object.append(paper('Se algum dia você voltar, procure aquilo que permanece quando tudo desaparecer.'));if(!state.letterRead)object.append(action('Guardar a carta',()=>{state.letterRead=true;addItem('carta');save();closeFocus();startTrain()}));else description.textContent='Uma mensagem que parece destinada a Elara.'}
if(next==='form'){object.append(paper('REGULAMENTO DE BAGAGEM\n\nBagagem de mão → MALA\nDocumentos pessoais → ENVELOPE\nRetirada autorizada → CHAVE'));description.textContent='A ordem de classificação pode ser importante.'}
if(next==='bag'){const d=document.createElement('div');d.className='dials';const symbols=['MALA','ENVELOPE','CHAVE','ESTRELA'];for(let i=0;i<3;i++){const b=document.createElement('button');b.className='dial';b.textContent=symbols[state.dials[i]];b.setAttribute('aria-label','Disco '+(i+1));b.onclick=()=>{state.dials[i]=(state.dials[i]+1)%4;b.textContent=symbols[state.dials[i]];save()};d.append(b)}object.append(d);object.append(action(state.opened?'Abrir tampa':'Tentar fechadura',()=>{if(state.opened){state.hasCase=true;addItem('estojo');save();openFocus('case');caption('ELARA','Encontrei meu estojo.')}else if(state.dials.join(',')==='0,1,2'){state.opened=true;save();caption('ELARA','A trava se soltou.');openFocus('bag')}else caption('ELARA','Ainda não. Preciso conferir os símbolos do formulário.')}));description.textContent=state.opened?'A fechadura está destrancada.':'Toque nos discos para mudar os símbolos.'}
if(next==='case'){const d=document.createElement('div');d.className='clue';[['Fotografia','photo'],['Carta','case_letter'],['Medalhão','medallion']].forEach(([name,id])=>d.append(action(name,()=>openFocus(id))));object.append(d);description.textContent='Três objetos cuidadosamente preservados.'}
if(next==='photo'){object.append(paper('VESPERA'));description.textContent='No verso: “Onde tudo começou.”'}
if(next==='case_letter'){object.append(paper('Se algum dia você voltar...'));description.textContent='A carta está incompleta.'}
if(next==='medallion'){object.append(paper('◎'));description.textContent='Círculos entrecruzados. Este símbolo parece familiar.'}
document.querySelector('#close').focus()}
function closeFocus(){if(['photo','case_letter','medallion'].includes(focus)){openFocus('case');return}focus='';modal.classList.remove('show');renderHotspots()}
document.querySelector('#close').onclick=closeFocus;modal.addEventListener('click',e=>{if(e.target===modal)closeFocus()});addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show'))closeFocus()});
const lines=[['CONDUTOR','Seu bilhete, por gentileza. Vespera... Não recebemos muitos passageiros a esta hora.'],['ELARA','O senhor conhece bem a cidade?'],['CONDUTOR','Conheço o caminho até lá. Curioso... tive a impressão de já ter visto este nome.'],['CONDUTOR','Desculpe. Deve ser apenas cansaço. A viagem será longa. Guarde bem seus pertences.']];
function startTrain(){state.stage=1;save();renderHotspots();dialogIndex=0;advanceDialog()}
function advanceDialog(){clearTimeout(dialogTimer);if(state.stage!==1)return;if(dialogIndex>=lines.length){state.stage=2;save();renderHotspots();caption('ELARA','Meu estojo deve estar no guarda-volumes.',5500);return}caption(...lines[dialogIndex++],4800);dialogTimer=setTimeout(advanceDialog,5000)}
document.querySelector('#hint').onclick=()=>{showHints=!showHints;renderHotspots();caption('','Os objetos interativos foram '+(showHints?'destacados.':'ocultados.'),1800)};
document.querySelector('#restart').onclick=()=>{if(!confirm('Reiniciar o prólogo e apagar o progresso salvo?'))return;clearTimeout(dialogTimer);state=fresh();save();modal.classList.remove('show');focus='';renderInventory();renderHotspots();caption('','Toque no envelope sobre a mesa para examiná-lo.')};
renderInventory();renderHotspots();if(state.stage===1){state.stage=2;save();renderHotspots();caption('ELARA','Meu estojo deve estar no guarda-volumes.')}else if(state.stage===0)caption('','Toque no envelope sobre a mesa para examiná-lo.');
</script></body></html>
